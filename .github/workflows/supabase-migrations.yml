name: Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Check required secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name repository secret is required for production database migrations."
              missing=1
            fi
          done
          exit "$missing"

      - name: Confirm Clubhouse target
        shell: bash
        run: |
          if [ "$SUPABASE_PROJECT_ID" != "lvlibxghdyvtxjnddfwf" ]; then
            echo "::error::Supabase target is not the authorized Clubhouse project."
            exit 1
          fi

      - name: Link Supabase project
        shell: bash
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Review pending migrations
        shell: bash
        run: |
          set -o pipefail
          supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee /tmp/clubhouse-migration-plan.txt
          pending=$(grep -oE '[0-9]{14}_[A-Za-z0-9_]+\.sql' /tmp/clubhouse-migration-plan.txt | sort -u || true)
          if [ -n "$pending" ] && [ "$pending" != "20260915130000_workout_test_corrections.sql" ]; then
            echo "::error::Unexpected pending migration. Review and authorize the migration plan before applying."
            exit 1
          fi
          if [ -z "$pending" ] && ! grep -qi 'database is up to date' /tmp/clubhouse-migration-plan.txt; then
            echo "::error::Could not verify the pending migration plan. No migrations will be applied."
            exit 1
          fi

      - name: Apply pending migrations
        shell: bash
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"
