name: Supabase Remote Verify

on:
  workflow_run:
    workflows:
      - Supabase Migrations
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-remote-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify remote Supabase
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check required secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name repository secret is required for remote Supabase verification."
              missing=1
            fi
          done
          exit "$missing"

      - name: Mask optional database URL secret
        if: ${{ env.SUPABASE_DB_URL != '' }}
        shell: bash
        run: echo "::add-mask::$SUPABASE_DB_URL"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify migrations, tables, RLS, functions, and seed data
        shell: bash
        run: node scripts/run-supabase-pooler-psql.mjs scripts/verify-remote-supabase.sql

      - name: Verify player roster membership RLS
        shell: bash
        run: node scripts/run-supabase-pooler-psql.mjs scripts/verify-player-membership-rls.sql

      - name: Verify staff invitation acceptance RPC
        shell: bash
        run: node scripts/run-supabase-pooler-psql.mjs scripts/verify-staff-invitation-acceptance.sql

      - name: Verify remote write/read persistence
        shell: bash
        env:
          SMOKE_MARKER: codex-remote-verify-${{ github.run_id }}
        run: node scripts/run-supabase-pooler-psql.mjs scripts/smoke-remote-supabase.sql
