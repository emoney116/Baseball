<!doctype html>
<html lang="en" dir="ltr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confirm your Clubhouse 9 email</title></head>
<body style="margin:0;padding:32px 20px;background:#f4f4f5;color:#18181b;font-family:Arial,Helvetica,sans-serif;">
  <table lang="en" dir="ltr" role="presentation" style="width:100%;max-width:440px;margin:0 auto;background:#ffffff;border:1px solid #e4e4e7;border-radius:16px;">
    <tr><td style="padding:32px;">
      <p style="margin:0 0 28px;font-size:16px;font-weight:bold;">CLUBHOUSE 9</p>
      <h1 style="margin:0 0 16px;font-size:26px;letter-spacing:-0.5px;">Confirm your email</h1>
      <p style="font-size:16px;line-height:1.6;color:#52525b;">Enter this six-digit code in Clubhouse to finish creating your account.</p>
      <p style="padding:20px 8px;text-align:center;background:#f4f4f5;border-radius:10px;font:600 32px monospace;letter-spacing:8px;">{{ .Token }}</p>
      <p style="font-size:16px;line-height:1.6;color:#52525b;">This code expires in 10 minutes. Use your most recent code.</p>
      <p style="font-size:16px;line-height:1.6;color:#52525b;">Never share your code. If you did not request this email, you can ignore it.</p>
      <p style="margin-top:24px;font-size:16px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 0;line-height:1.4;color:#760e1e;">Or confirm your email in your browser</a></p>
    </td></tr>
  </table>
</body>
</html>
