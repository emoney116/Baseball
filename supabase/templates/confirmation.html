<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>Confirm your Clubhouse 9 email</title>
  <style>
    :root { color-scheme: dark; supported-color-schemes: dark; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
    @media (prefers-color-scheme: dark) {
      .email-canvas { background-color: #111111 !important; }
      .email-panel { background-color: #171717 !important; }
      .email-code { background-color: #202020 !important; color: #ffffff !important; }
      .email-title { color: #ffffff !important; }
      .email-copy { color: #d6d6d6 !important; }
      .email-muted { color: #9a9a9a !important; }
      .email-button { background-color: #760e1e !important; color: #ffffff !important; }
    }
  </style>
</head>
<body class="email-canvas" bgcolor="#111111" style="margin:0;padding:0;background-color:#111111;color:#ffffff;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;">
  <table lang="en" dir="ltr" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" class="email-canvas" bgcolor="#111111" style="width:100%;background-color:#111111;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;max-width:440px;margin:0 auto;">
        <tr><td align="center" style="padding:0 0 28px;">
          <img src="https://www.clubhouse9sports.com/brand/clubhouse9-wordmark.png" alt="Clubhouse 9" width="220" style="display:block;width:220px;max-width:100%;height:auto;border:0;">
        </td></tr>
        <tr><td class="email-panel" bgcolor="#171717" style="padding:28px 24px;background-color:#171717;border:1px solid #303030;border-top:4px solid #760e1e;border-radius:12px;">
          <h1 class="email-title" style="margin:0 0 12px;color:#ffffff;font-size:26px;line-height:1.25;letter-spacing:-0.5px;">Confirm your email</h1>
          <p class="email-copy" style="margin:0 0 24px;color:#d6d6d6;font-size:16px;line-height:1.6;">Enter this six-digit code in Clubhouse to finish creating your account.</p>
          <p class="email-code" style="margin:0 0 20px;padding:20px 8px;text-align:center;background-color:#202020;color:#ffffff;border:1px solid #303030;border-radius:8px;font:600 32px/1.3 'Courier New',monospace;letter-spacing:6px;">{{ .Token }}</p>
          <p class="email-copy" style="margin:0 0 24px;color:#d6d6d6;font-size:16px;line-height:1.6;">This code expires in 10 minutes. Use your most recent code.</p>
          <p class="email-muted" style="margin:0 0 12px;color:#9a9a9a;font-size:16px;line-height:1.5;">Prefer to use a link?</p>
          <a href="{{ .ConfirmationURL }}" class="email-button" style="display:block;padding:14px 16px;background-color:#760e1e;color:#ffffff;border-radius:8px;text-align:center;text-decoration:none;font-size:16px;font-weight:bold;line-height:1.4;">Confirm email address</a>
        </td></tr>
        <tr><td style="padding:20px 8px 0;">
          <p class="email-muted" style="margin:0;color:#9a9a9a;text-align:center;font-size:16px;line-height:1.6;">Never share your code. If you did not request this email, you can ignore it.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
